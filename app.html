<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panda Explorer · Тренажёр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Nunito:wght@400;600;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="wrap">

<header>
  <a href="index.html" class="mascot-link" title="Сменить ученика">
  <svg class="mascot" viewBox="0 0 64 64" aria-hidden="true">
    <ellipse cx="17" cy="21" rx="8" ry="8" fill="#23201F"/>
    <ellipse cx="47" cy="21" rx="8" ry="8" fill="#23201F"/>
    <ellipse cx="32" cy="36" rx="21" ry="19" fill="#fff" stroke="#23201F" stroke-width="2.4"/>
    <ellipse cx="24" cy="35" rx="6" ry="7" fill="#23201F"/>
    <ellipse cx="40" cy="35" rx="6" ry="7" fill="#23201F"/>
    <circle cx="25" cy="34" r="2.2" fill="#fff"/><circle cx="41" cy="34" r="2.2" fill="#fff"/>
    <ellipse cx="32" cy="44" rx="3.4" ry="2.6" fill="#23201F"/>
    <path d="M8 20 Q32 10 56 20 Q32 25 8 20Z" fill="#3E7B5E"/>
    <path d="M20 20 Q32 2 44 20Z" fill="#3E7B5E"/>
    <path d="M20 17 Q32 13 44 17" stroke="#D6402C" stroke-width="3" fill="none"/>
  </svg></a>
  <div class="brand">Panda Explorer<small id="whoLine">Загрузка…</small></div>
  <div class="hdr-right"><div class="streak" id="streak">🔥 0</div></div>
</header>

<section id="home">
  <p class="section-label" id="homeLabel">Выбери тему</p>
  <div class="grid" id="topicGrid"></div>
</section>

<section id="modes" class="hide">
  <button class="back" data-go="home">← Все темы</button>
  <h2 id="modeTitle"></h2>
  <p class="hint" id="modeSub"></p>
  <div class="modes" id="modeList"></div>
</section>

<section id="play" class="hide">
  <button class="back" data-go="modes">← Другой режим</button>
  <div class="progress-row">
    <div class="pbar"><i id="pbar"></i></div>
    <div class="count" id="count"></div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="actions" id="actions"></div>
</section>

<section id="results" class="hide">
  <div class="stage results-stage">
    <div class="score" id="scoreLine"></div>
    <p class="hint" id="scoreSub"></p>
    <div class="mistakes hide" id="mistakes"><p class="section-label">Повторить</p><ul></ul></div>
    <div class="actions">
      <button class="btn" id="again">Ещё раз</button>
      <button class="btn ghost" data-go="modes">Другой режим</button>
      <button class="btn ghost" data-go="home">К темам</button>
    </div>
  </div>
</section>

</div>

<script>
/* ================= настройки режимов ================= */
const MODES=[
 {id:"cards", cn:"认字", t:"Карточки",        d:"Смотришь иероглиф, вспоминаешь сам. Без счёта очков."},
 {id:"choice",cn:"选择", t:"Выбери перевод",  d:"Иероглиф → четыре варианта. Быстрая проверка."},
 {id:"listen",cn:"听力", t:"На слух",         d:"Слушаешь озвучку и находишь нужный иероглиф."},
 {id:"pinyin",cn:"拼音", t:"Впиши пиньинь",   d:"Печатаешь чтение. Тоны ставить не обязательно."},
 {id:"sent",  cn:"造句", t:"Собери фразу",    d:"Расставь слова в правильном порядке.", needsSent:true},
 {id:"blitz", cn:"闪电", t:"Молния · 60 сек", d:"Сколько слов успеешь за минуту? Есть рекорд."},
 {id:"memory",cn:"配对", t:"Пары",            d:"Найди иероглиф и его перевод. Игра на память."}
];

/* ================= хранилище ================= */
const mem={};
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return k in mem?mem[k]:d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){mem[k]=v}}
};

/* ================= озвучка ================= */
let zhVoice=null;
function pickVoice(){const vs=speechSynthesis.getVoices();
  zhVoice=vs.find(v=>v.lang==='zh-CN')||vs.find(v=>v.lang&&v.lang.startsWith('zh'))||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(t){if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);
  u.lang='zh-CN';u.rate=.8;if(zhVoice)u.voice=zhVoice;speechSynthesis.speak(u)}

/* ================= утилиты ================= */
const $=s=>document.querySelector(s);
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
const strip=s=>s.normalize('NFD').replace(/[\u0300-\u030f]/g,'').replace(/[\s']/g,'').toLowerCase();
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ================= состояние ================= */
let DB=null, SID='lera', ALL=[];
let S={topic:null,mode:null,queue:[],i:0,ok:0,wrong:[],locked:false,timer:null};

function show(id){['home','modes','play','results'].forEach(s=>$('#'+s).classList.toggle('hide',s!==id));
  window.scrollTo({top:0,behavior:'smooth'})}
function stopTimers(){if(S.timer){clearInterval(S.timer);S.timer=null}}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');
  if(g){stopTimers();show(g.dataset.go);if(g.dataset.go==='home')renderHome()}});

/* ================= загрузка ================= */
(async function boot(){
  SID=new URLSearchParams(location.search).get('student')||'lera';
  try{
    const r=await fetch('data/'+SID+'.json');
    if(!r.ok)throw 0;
    DB=await r.json();
  }catch(e){
    $('#whoLine').textContent='ошибка';
    $('#topicGrid').innerHTML='<p class="hint">Не удалось загрузить словарь <b>data/'+esc(SID)+
      '.json</b>. Если открываешь файл с диска — нужен локальный сервер или GitHub Pages.</p>';
    return;
  }
  ALL=DB.topics.flatMap(t=>t.w);
  $('#whoLine').textContent=DB.name+' · '+DB.book;
  document.title='Panda Explorer · '+DB.name;
  $('#homeLabel').textContent='Выбери тему · '+DB.topics.length+' тем · '+ALL.length+' слов';
  renderHome();
})();

/* ================= стрик ================= */
function touchStreak(){const today=new Date().toISOString().slice(0,10);
  const st=store.get('pe_streak',{last:null,n:0});if(st.last===today)return;
  const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
  st.n=st.last===y?st.n+1:1;st.last=today;store.set('pe_streak',st)}
function paintStreak(){$('#streak').textContent='🔥 '+store.get('pe_streak',{n:0}).n}

/* ================= главный экран ================= */
const K=n=>'pe_'+SID+'_'+n;
function renderHome(){
  paintStreak();
  const best=store.get(K('best'),{});
  $('#topicGrid').innerHTML=DB.topics.map(t=>{
    const p=best[t.id]||0;
    const tag=t.lesson?'Урок '+t.lesson:'Сверх учебника';
    return `<button class="topic" data-topic="${t.id}">
      <span class="row1"><span class="em">${t.em}</span><span class="lesson">${tag}</span></span>
      <span class="t">${esc(t.t)}</span><span class="cn zh">${t.cn}</span>
      <span class="meta"><span>${t.w.length} слов</span>
      <span class="bar"><i style="width:${p}%"></i></span><span>${p}%</span></span>
    </button>`}).join('');
  $('#topicGrid').querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>openTopic(b.dataset.topic));
}

function sentsFor(t){
  if(!DB.sentences)return[];
  return t.lesson?DB.sentences.filter(s=>s.lesson===t.lesson):DB.sentences.filter(s=>s.lesson===0);
}

function openTopic(id){
  S.topic=DB.topics.find(t=>t.id===id);
  const t=S.topic, ns=sentsFor(t).length;
  $('#modeTitle').innerHTML=`${t.em} ${esc(t.t)} <span class="zh cnbig">${t.cn}</span>`;
  $('#modeSub').textContent=(t.lesson?`Урок ${t.lesson} · `:'Сверх учебника · ')+
    `${t.w.length} слов`+(ns?` · ${ns} фраз`:'');
  const blitzBest=store.get(K('blitz'),0), memBest=store.get(K('mem_'+t.id),0);
  $('#modeList').innerHTML=MODES.map(m=>{
    const off=m.needsSent&&ns===0;
    const extra=m.id==='blitz'&&blitzBest?`<u>рекорд ${blitzBest}</u>`:
                m.id==='memory'&&memBest?`<u>лучший ход ${memBest}</u>`:'';
    return `<button class="mode${off?' off':''}" data-mode="${m.id}"${off?' disabled':''}>
      <b><span class="zh">${m.cn}</span> · ${m.t}</b>
      <span>${off?'Для этой темы фраз пока нет':m.d}</span>${extra}</button>`}).join('');
  $('#modeList').querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>start(b.dataset.mode));
  show('modes');
}

/* ================= запуск ================= */
$('#again').onclick=()=>start(S.mode);
function start(mode){
  stopTimers();S.mode=mode;S.i=0;S.ok=0;S.wrong=[];S.locked=false;
  $('#stage').classList.remove('flat');
  $('#pbar').style.background='';$('#pbar').style.width='0%';
  show('play');
  if(mode==='sent'){S.queue=shuffle(sentsFor(S.topic).slice());return next()}
  if(mode==='blitz')return blitzStart();
  if(mode==='memory')return memoryStart();
  S.queue=shuffle(S.topic.w.slice());next();
}

function next(){
  if(S.i>=S.queue.length)return finish();
  S.locked=false;
  $('#count').textContent=`${S.i+1} / ${S.queue.length}`;
  $('#pbar').style.width=(S.i/S.queue.length*100)+'%';
  ({cards:qCards,choice:qChoice,listen:qListen,pinyin:qPinyin,sent:qSent})[S.mode]();
}

function stamp(good){
  const el=document.createElement('div');
  el.className='seal show'+(good?'':' wrong');
  el.innerHTML=`<div class="seal-box zh">${good?'对':'错'}</div>`;
  $('#stage').appendChild(el);setTimeout(()=>el.remove(),1100);
}
function judge(good,item,say){
  if(S.locked)return;S.locked=true;
  if(good)S.ok++;else S.wrong.push(item);
  stamp(good);if(say)speak(say);
  setTimeout(()=>{S.i++;next()},good?900:1800);
}

/* ---------- 1. карточки ---------- */
function qCards(){
  const w=S.queue[S.i];
  $('#stage').innerHTML=`<button class="sound" title="Озвучить">🔊</button>
    <div class="hanzi zh">${w[0]}</div><div class="hint">Вспомни чтение и перевод</div>`;
  $('#stage .sound').onclick=()=>speak(w[0]);
  $('#actions').innerHTML=`<button class="btn" id="flip">Показать ответ</button>`;
  $('#flip').onclick=()=>{
    speak(w[0]);
    $('#stage').innerHTML=`<button class="sound">🔊</button><div class="hanzi zh">${w[0]}</div>
      <div class="pinyin">${w[1]}</div><div class="ru">${esc(w[2])}</div>`;
    $('#stage .sound').onclick=()=>speak(w[0]);
    $('#actions').innerHTML=`<button class="btn ghost" id="bad">Ещё не помню</button>
      <button class="btn" id="good">Знаю</button>`;
    $('#good').onclick=()=>{S.ok++;S.i++;next()};
    $('#bad').onclick=()=>{S.wrong.push(w);S.i++;next()};
  };
}

/* ---------- 2. выбери перевод ---------- */
function qChoice(){
  const w=S.queue[S.i];
  const pool=S.topic.w.filter(x=>x[2]!==w[2]);
  const opts=shuffle([w,...shuffle(pool).slice(0,3)]);
  $('#stage').innerHTML=`<button class="sound">🔊</button><div class="hanzi zh">${w[0]}</div>
    <div class="hint">Что это значит?</div>`;
  $('#stage .sound').onclick=()=>speak(w[0]);
  $('#actions').innerHTML=`<div class="opts">${opts.map((o,n)=>
    `<button class="opt" data-n="${n}">${esc(o[2])}</button>`).join('')}</div>`;
  $('#actions').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(S.locked)return;
    const good=opts[b.dataset.n][2]===w[2];
    $('#actions').querySelectorAll('.opt').forEach((x,n)=>{x.disabled=true;
      if(opts[n][2]===w[2])x.classList.add('ok')});
    if(!good)b.classList.add('no');
    judge(good,w,w[0]);
  });
}

/* ---------- 3. на слух ---------- */
function qListen(){
  const w=S.queue[S.i];
  const pool=S.topic.w.filter(x=>x[0]!==w[0]);
  const opts=shuffle([w,...shuffle(pool).slice(0,3)]);
  $('#stage').innerHTML=`<div class="bigemoji">🎧</div>
    <div class="hint">Послушай и выбери иероглиф</div>`;
  $('#actions').innerHTML=`<button class="btn" id="pl">🔊 Послушать ещё раз</button>
    <div class="opts">${opts.map((o,n)=>
      `<button class="opt" data-n="${n}"><span class="zh">${o[0]}</span></button>`).join('')}</div>`;
  $('#pl').onclick=()=>speak(w[0]);
  setTimeout(()=>speak(w[0]),350);
  $('#actions').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(S.locked)return;
    const good=opts[b.dataset.n][0]===w[0];
    $('#actions').querySelectorAll('.opt').forEach((x,n)=>{x.disabled=true;
      if(opts[n][0]===w[0])x.classList.add('ok')});
    if(!good)b.classList.add('no');
    $('#stage').innerHTML=`<div class="hanzi zh">${w[0]}</div>
      <div class="pinyin">${w[1]}</div><div class="ru">${esc(w[2])}</div>`;
    judge(good,w,null);
  });
}

/* ---------- 4. впиши пиньинь ---------- */
function qPinyin(){
  const w=S.queue[S.i];
  $('#stage').innerHTML=`<button class="sound">🔊</button><div class="hanzi zh">${w[0]}</div>
    <div class="ru">${esc(w[2])}</div>
    <div class="type-row"><input type="text" id="inp" placeholder="ni hao"
      autocomplete="off" autocapitalize="off" spellcheck="false"></div>
    <div class="hint">Тоны ставить не обязательно</div>`;
  $('#stage .sound').onclick=()=>speak(w[0]);
  $('#actions').innerHTML=`<button class="btn" id="chk">Проверить</button>`;
  const inp=$('#inp');inp.focus();
  const check=()=>{
    if(S.locked)return;
    const good=strip(inp.value)===strip(w[1]);
    inp.classList.add(good?'ok':'no');inp.disabled=true;
    $('#stage').insertAdjacentHTML('beforeend',`<div class="pinyin">${w[1]}</div>`);
    judge(good,w,w[0]);
  };
  $('#chk').onclick=check;
  inp.onkeydown=e=>{if(e.key==='Enter')check()};
}

/* ---------- 5. собери фразу ---------- */
function qSent(){
  const s=S.queue[S.i];
  const chips=shuffle(s.tk.map((x,n)=>({x,n})));
  let built=[];
  $('#stage').innerHTML=`<div class="ru sent-ru">${esc(s.ru)}</div>
    <div class="built" id="built"><span class="hint">Нажимай слова по порядку</span></div>
    <div class="chips" id="chips"></div>`;
  $('#actions').innerHTML=`<button class="btn ghost" id="clr">Сбросить</button>
    <button class="btn" id="chk">Проверить</button>`;
  const paint=()=>{
    $('#built').innerHTML=built.length
      ? built.map((b,i)=>`<button class="chip built-chip zh" data-i="${i}">${b.x}</button>`).join('')
      : '<span class="hint">Нажимай слова по порядку</span>';
    $('#chips').innerHTML=chips.map(c=>
      `<button class="chip zh" data-n="${c.n}"${built.some(b=>b.n===c.n)?' disabled':''}>${c.x}</button>`).join('');
    $('#chips').querySelectorAll('.chip:not([disabled])').forEach(b=>b.onclick=()=>{
      built.push(chips.find(c=>c.n==b.dataset.n));paint()});
    $('#built').querySelectorAll('.built-chip').forEach(b=>b.onclick=()=>{
      built.splice(+b.dataset.i,1);paint()});
  };
  paint();
  $('#clr').onclick=()=>{built=[];paint()};
  $('#chk').onclick=()=>{
    if(S.locked)return;
    if(built.length!==s.tk.length)return;
    const line=built.map(b=>b.x).join('');
    const good=line===s.tk.join('');
    $('#stage').innerHTML=`<div class="ru sent-ru">${esc(s.ru)}</div>
      <div class="answer zh">${s.tk.join('')}。</div>
      ${good?'':`<div class="hint">Ты собрал: ${line}</div>`}`;
    $('#actions').innerHTML='';
    judge(good,{0:s.tk.join(''),1:'',2:s.ru},s.tk.join(''));
  };
}

/* ---------- 6. молния (60 сек) ---------- */
function blitzStart(){
  let left=60,score=0,tries=0;
  const deck=()=>shuffle(S.topic.w.slice());
  let pool=deck();
  const ask=()=>{
    if(!pool.length)pool=deck();
    const w=pool.pop();
    const others=shuffle(ALL.filter(x=>x[2]!==w[2])).slice(0,3);
    const opts=shuffle([w,...others]);
    $('#stage').innerHTML=`<div class="hanzi zh">${w[0]}</div>`;
    $('#actions').innerHTML=`<div class="opts">${opts.map((o,n)=>
      `<button class="opt" data-n="${n}">${esc(o[2])}</button>`).join('')}</div>`;
    $('#actions').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      tries++;
      const good=opts[b.dataset.n][2]===w[2];
      if(good)score++;else S.wrong.push(w);
      b.classList.add(good?'ok':'no');
      $('#count').textContent=score+' ✔';
      setTimeout(ask,good?120:520);
    });
  };
  $('#count').textContent='0 ✔';
  ask();
  const tick=()=>{
    left--;
    $('#pbar').style.width=(left/60*100)+'%';
    $('#pbar').style.background=left<=10?'var(--cinnabar)':'';
    if(left<=0){
      stopTimers();
      const best=store.get(K('blitz'),0);
      if(score>best)store.set(K('blitz'),score);
      S.ok=score;S.queue={length:tries||1};
      finishCustom(`${score} ✔`,
        `За минуту · точность ${tries?Math.round(score/tries*100):0}%` +
        (score>best?`<br><b>Новый рекорд!</b> Было ${best}`:`<br>Рекорд: ${Math.max(best,score)}`));
    }
  };
  $('#pbar').style.width='100%';
  S.timer=setInterval(tick,1000);
}

/* ---------- 7. пары ---------- */
function memoryStart(){
  const picks=shuffle(S.topic.w.slice()).slice(0,Math.min(6,S.topic.w.length));
  const cards=shuffle(picks.flatMap((w,i)=>[
    {p:i,face:w[0],zh:true,w},{p:i,face:w[2],zh:false,w}]));
  let open=[],done=0,moves=0;
  $('#count').textContent='0 ходов';
  $('#pbar').style.width='0%';
  $('#stage').classList.add('flat');
  $('#actions').innerHTML='';
  const paint=()=>{
    $('#stage').innerHTML=`<div class="mem">${cards.map((c,i)=>{
      const st=c.matched?'matched':(open.includes(i)?'open':'');
      return `<button class="mcard ${st}" data-i="${i}">
        <span class="${c.zh?'zh mzh':'mru'}">${st?esc(c.face):''}</span></button>`}).join('')}</div>`;
    $('#stage').querySelectorAll('.mcard:not(.matched):not(.open)').forEach(b=>b.onclick=()=>flip(+b.dataset.i));
  };
  const flip=i=>{
    if(open.length>=2||open.includes(i))return;
    open.push(i);
    if(cards[i].zh)speak(cards[i].face);
    paint();
    if(open.length===2){
      moves++;$('#count').textContent=moves+' ходов';
      const [a,b]=open;
      if(cards[a].p===cards[b].p){
        cards[a].matched=cards[b].matched=true;done++;
        $('#pbar').style.width=(done/picks.length*100)+'%';
        open=[];paint();
        if(done===picks.length){
          const best=store.get(K('mem_'+S.topic.id),0);
          if(!best||moves<best)store.set(K('mem_'+S.topic.id),moves);
          S.ok=picks.length;S.queue={length:picks.length};
          setTimeout(()=>{$('#stage').classList.remove('flat');
            finishCustom(`${moves} ходов`,
              `Все ${picks.length} пар найдены.`+
              (!best||moves<best?`<br><b>Лучший результат!</b>`:`<br>Твой рекорд: ${best}`))},600);
        }
      }else setTimeout(()=>{open=[];paint()},900);
    }
  };
  paint();
}

/* ================= итоги ================= */
function finishCustom(big,sub){
  stopTimers();touchStreak();paintStreak();
  $('#scoreLine').textContent=big;
  $('#scoreSub').innerHTML=sub;
  const m=$('#mistakes');
  if(S.wrong.length){m.classList.remove('hide');
    m.querySelector('ul').innerHTML=S.wrong.map(w=>
      `<li><span class="zh">${w[0]}</span><em>${w[1]||''}</em><s>${esc(w[2])}</s></li>`).join('')}
  else m.classList.add('hide');
  show('results');
}

function finish(){
  $('#pbar').style.width='100%';
  const total=S.queue.length, pct=Math.round(S.ok/total*100);
  const best=store.get(K('best'),{});
  if(pct>(best[S.topic.id]||0)){best[S.topic.id]=pct;store.set(K('best'),best)}
  const n=pct>=90?3:pct>=70?2:pct>=40?1:0;
  const stars=`<span class="stars">${'★'.repeat(n)}${'☆'.repeat(3-n)}</span>`;
  finishCustom(`${S.ok} / ${total}`, stars+'<br>'+
    (pct>=90?'很厉害！Почти всё без ошибок.':
     pct>=70?'Хорошо. Осталось добить несколько слов.':
